name: Inspect Runner
on: push

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print kernel details and file listing
        run: |
          uname -a
          ls -la

      - name: Count repository files
        run: |
          find . -maxdepth 2 -not -path '*/.*' | wc -l
